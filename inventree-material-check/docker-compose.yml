# InvenTree ve bağımlı servislerin tanımlandığı Docker Compose dosyası

services:

  # PostgreSQL veritabanı servisi
  inventree-db:
    image: postgres:16
    container_name: inventree-db
    environment:
      POSTGRES_DB: ${INVENTREE_DB_NAME}
      POSTGRES_USER: ${INVENTREE_DB_USER}
      POSTGRES_PASSWORD: ${INVENTREE_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTREE_DB_USER} -d ${INVENTREE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Tek seferlik kurulum servisi — migrate + admin kullanıcısı oluşturma
  setup:
    image: inventree/inventree:stable
    container_name: inventree-setup
    command: invoke update
    depends_on:
      inventree-db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - inventree-data:${INVENTREE_EXT_VOLUME}
    restart: "no"

  # InvenTree ana uygulama servisi
  server:
    image: inventree/inventree:stable
    container_name: inventree-server
    depends_on:
      setup:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - inventree-data:${INVENTREE_EXT_VOLUME}
      - ./plugin/material_check:/home/inventree/plugins/material_check
    ports:
      - ${INVENTREE_WEB_PORT}:8000
    restart: unless-stopped

  # Arka plan işleri için worker servisi
  worker:
    image: inventree/inventree:stable
    container_name: inventree-worker
    command: invoke worker
    depends_on:
      setup:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - inventree-data:${INVENTREE_EXT_VOLUME}
      - ./plugin/material_check:/home/inventree/plugins/material_check
    restart: unless-stopped

# Kalıcı veri depolama alanları
volumes:
  pgdata:
  inventree-data: